apiVersion: v1
kind: Pod
metadata:
  name: compliant-pod-with-all-limits
  namespace: default
spec:
  containers:
  - image: nginx:1.21
    name: app-container
    resources:
      limits:
        cpu: 500m
        memory: 512Mi

---
apiVersion: v1
kind: Pod
metadata:
  name: compliant-pod-multiple-containers
  namespace: default
spec:
  containers:
  - image: nginx:1.21
    name: web-server
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
  - image: busybox:1.35
    name: sidecar
    resources:
      limits:
        cpu: 100m
        memory: 128Mi

---
apiVersion: v1
kind: Pod
metadata:
  name: compliant-pod-with-init-containers
  namespace: default
spec:
  containers:
  - image: nginx:1.21
    name: main-app
    resources:
      limits:
        cpu: 800m
        memory: 1Gi
  initContainers:
  - image: busybox:1.35
    name: init-setup
    resources:
      limits:
        cpu: 200m
        memory: 256Mi

---
apiVersion: v1
kind: Pod
metadata:
  name: compliant-pod-with-ephemeral-containers
  namespace: default
spec:
  containers:
  - image: nginx:1.21
    name: main-container
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
  ephemeralContainers:
  - image: busybox:1.35
    name: debug-container
    resources:
      limits:
        cpu: 100m
        memory: 128Mi

---
apiVersion: v1
kind: Pod
metadata:
  name: non-compliant-no-limits
  namespace: default
spec:
  containers:
  - image: nginx:1.21
    name: unlimited-container

---
apiVersion: v1
kind: Pod
metadata:
  name: non-compliant-missing-cpu-limit
  namespace: default
spec:
  containers:
  - image: nginx:1.21
    name: memory-only-container
    resources:
      limits:
        memory: 512Mi

---
apiVersion: v1
kind: Pod
metadata:
  name: non-compliant-missing-memory-limit
  namespace: default
spec:
  containers:
  - image: nginx:1.21
    name: cpu-only-container
    resources:
      limits:
        cpu: 500m

---
apiVersion: v1
kind: Pod
metadata:
  name: non-compliant-empty-limits
  namespace: default
spec:
  containers:
  - image: nginx:1.21
    name: empty-limits-container
    resources:
      limits: {}

---
apiVersion: v1
kind: Pod
metadata:
  name: non-compliant-mixed-compliance
  namespace: default
spec:
  containers:
  - image: nginx:1.21
    name: compliant-container
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
  - image: busybox:1.35
    name: non-compliant-container
    resources:
      limits:
        cpu: 200m

---
apiVersion: v1
kind: Pod
metadata:
  name: non-compliant-init-container-missing-limits
  namespace: default
spec:
  containers:
  - image: nginx:1.21
    name: main-with-limits
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
  initContainers:
  - image: busybox:1.35
    name: init-no-limits

---
apiVersion: v1
kind: Pod
metadata:
  name: non-compliant-requests-only
  namespace: default
spec:
  containers:
  - image: nginx:1.21
    name: requests-only-container
    resources:
      requests:
        cpu: 250m
        memory: 256Mi

---
apiVersion: v1
kind: Pod
metadata:
  name: edge-case-zero-limits
  namespace: default
spec:
  containers:
  - image: nginx:1.21
    name: zero-limits-container
    resources:
      limits:
        cpu: "0"
        memory: "0"
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  annotations:
    policies.kyverno.io/category: "Pod Security Standards"
    policies.kyverno.io/description: "Requires all containers in pods to have both CPU and memory resource limits defined to prevent resource exhaustion attacks and enforce K01 control for resource management."
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/title: "Require Pod Resource Limits"
  name: require-pod-resource-limits
spec:
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  - expression: "variables.allContainers.all(c, has(c.resources) && has(c.resources.limits) && has(c.resources.limits.cpu) && has(c.resources.limits.memory))"
    messageExpression: "'All containers must have both CPU and memory limits defined. Missing limits on: ' + variables.allContainers.filter(c, !has(c.resources) || !has(c.resources.limits) || !has(c.resources.limits.cpu) || !has(c.resources.limits.memory)).map(c, c.name).join(', ')"
  variables:
  - expression: "object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])"
    name: allContainers
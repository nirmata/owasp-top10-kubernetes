apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  annotations:
    policies.kyverno.io/category: "Pod Security Standards (Restricted)"
    policies.kyverno.io/description: "Enforces that containers run as non-root users by validating runAsNonRoot is true and runAsUser is not 0. This policy implements the K01 security control requirement."
    policies.kyverno.io/minversion: "1.14.0"
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/title: "K01 - Enforce Non-Root Containers"
    security.control.description: "Containers must not run as root user to reduce privilege escalation risks"
    security.control.id: "K01"
    security.control.name: "Non-Root Container Execution"
  name: k01-enforce-non-root-containers
spec:
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  - expression: |
      variables.allContainers.all(container, 
        container.?securityContext.?runAsUser.orValue(null) == 0 ? false : 
        (container.?securityContext.?runAsUser.orValue(null) != null && container.?securityContext.?runAsUser.orValue(null) != 0) ||
        container.?securityContext.?runAsNonRoot.orValue(false) == true ||
        (variables.podRunAsNonRoot == true && container.?securityContext.?runAsNonRoot.orValue(null) == null) ||
        (variables.podRunAsUser != null && variables.podRunAsUser != 0 && container.?securityContext.?runAsUser.orValue(null) == null && container.?securityContext.?runAsNonRoot.orValue(null) == null)
      )
    messageExpression: "'K01 Violation: Containers must run as non-root. Set runAsNonRoot: true or runAsUser to a non-zero value. Containers with runAsUser: 0 are explicitly forbidden. Non-compliant containers: ' + variables.allContainers.filter(c, !(c.?securityContext.?runAsUser.orValue(null) == 0 ? false : (c.?securityContext.?runAsUser.orValue(null) != null && c.?securityContext.?runAsUser.orValue(null) != 0) || c.?securityContext.?runAsNonRoot.orValue(false) == true || (variables.podRunAsNonRoot == true && c.?securityContext.?runAsNonRoot.orValue(null) == null) || (variables.podRunAsUser != null && variables.podRunAsUser != 0 && c.?securityContext.?runAsUser.orValue(null) == null && c.?securityContext.?runAsNonRoot.orValue(null) == null))).map(c, c.name).join(', ')"
  variables:
  - expression: "object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])"
    name: allContainers
  - expression: "object.spec.?securityContext.?runAsNonRoot.orValue(false)"
    name: podRunAsNonRoot
  - expression: "object.spec.?securityContext.?runAsUser.orValue(null)"
    name: podRunAsUser